<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Yirviel Somé — Asset Management and Portfolio Management, Casablanca">
  <defs>
    <linearGradient id="amPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="amRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0B252"/>
      <stop offset="0.6" stop-color="#E0B252" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#E0B252" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="amGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#0B1220" stop-opacity="0"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="amClip"><rect width="1000" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .am-sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
    .am-mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;}
    .am-ink{fill:#E6EDF3}.am-muted{fill:#94A3B8}.am-dim{fill:#64748B}
    .am-gold{fill:#E0B252}.am-mint{fill:#34D399}.am-cyan{fill:#38BDF8}
    @keyframes amDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    .am-curve{stroke-dasharray:1;stroke-dashoffset:1;animation:amDraw 2.6s ease-out forwards}
    @media (prefers-reduced-motion: reduce){.am-curve{animation:none;stroke-dashoffset:0}}
  </style>

  <g clip-path="url(#amClip)">
    <rect width="1000" height="340" fill="url(#amPanel)"/>
    <rect x="0.75" y="0.75" width="998.5" height="338.5" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <g opacity="0.35">
      <line x1="0" y1="70" x2="1000" y2="70" stroke="#0F172A"/>
      <line x1="0" y1="120" x2="1000" y2="120" stroke="#0F172A"/>
      <line x1="0" y1="170" x2="1000" y2="170" stroke="#0F172A"/>
      <line x1="0" y1="220" x2="1000" y2="220" stroke="#0F172A"/>
    </g>

    <!-- memo header -->
    <text x="44" y="34" class="am-mono am-gold" font-size="11" letter-spacing="2.6">INVESTMENT MEMO</text>
    <text x="956" y="34" text-anchor="end" class="am-mono am-dim" font-size="11" letter-spacing="1.8">CASABLANCA · 2026</text>
    <line x1="44" y1="48" x2="956" y2="48" stroke="#1E293B"/>

    <!-- identity -->
    <text x="44" y="86" class="am-mono am-mint" font-size="11.5" letter-spacing="3">ASSET MANAGEMENT · PORTFOLIO MANAGEMENT</text>
    <text x="42" y="138" class="am-sans am-ink" font-size="46" font-weight="800" letter-spacing="-0.6">Yirviel Somé</text>
    <rect x="44" y="154" width="186" height="3" rx="1.5" fill="url(#amRule)"/>
    <text x="44" y="184" class="am-sans am-ink" font-size="17" font-weight="600">Allocation · Risk · Research · Attribution</text>
    <text x="44" y="208" class="am-sans am-muted" font-size="13">The desk a portfolio manager is accountable for — built in public,</text>
    <text x="44" y="226" class="am-sans am-muted" font-size="13">from the investment policy to the attribution report.</text>

    <!-- credential chips -->
    <g class="am-mono" font-size="10.5">
      <rect x="44" y="244" width="74" height="25" rx="12.5" fill="#0F172A" stroke="#334155"/>
      <text x="81" y="260" text-anchor="middle" class="am-muted">FMVA®</text>
      <rect x="128" y="244" width="66" height="25" rx="12.5" fill="#0F172A" stroke="#334155"/>
      <text x="161" y="260" text-anchor="middle" class="am-muted">BIDA®</text>
      <rect x="204" y="244" width="168" height="25" rx="12.5" fill="#0F172A" stroke="#E0B252" stroke-opacity="0.55"/>
      <text x="288" y="260" text-anchor="middle" class="am-gold">CFA® TRACK · PREPARING</text>
    </g>

    
    <!-- process panel -->
    <rect x="620" y="66" width="336" height="204" rx="14" fill="#0A101D" stroke="#1E293B"/>
    <text x="640" y="92" class="am-mono am-gold" font-size="10.5" letter-spacing="2.2">THE PROCESS</text>
    <text x="936" y="92" text-anchor="end" class="am-mono am-dim" font-size="9.5">01 — 05</text>
    <line x1="640" y1="102" x2="936" y2="102" stroke="#1E293B"/>

    <g class="am-mono" font-size="10.5">
      <line x1="651" y1="130" x2="651" y2="244" stroke="#334155" stroke-width="1"/>
      <circle cx="651" cy="130" r="3" fill="#E0B252"/>
      <text x="668" y="134" class="am-gold">01</text>
      <text x="692" y="134" class="am-ink">Mandate &amp; IPS</text>
      <text x="936" y="134" text-anchor="end" class="am-dim">constraints</text>

      <circle cx="651" cy="158" r="3" fill="#34D399"/>
      <text x="668" y="162" class="am-mint">02</text>
      <text x="692" y="162" class="am-ink">Strategic allocation</text>
      <text x="936" y="162" text-anchor="end" class="am-dim">beta</text>

      <circle cx="651" cy="186" r="3" fill="#38BDF8"/>
      <text x="668" y="190" class="am-cyan">03</text>
      <text x="692" y="190" class="am-ink">Security selection</text>
      <text x="936" y="190" text-anchor="end" class="am-dim">valuation</text>

      <circle cx="651" cy="214" r="3" fill="#E0B252"/>
      <text x="668" y="218" class="am-gold">04</text>
      <text x="692" y="218" class="am-ink">Construction &amp; risk</text>
      <text x="936" y="218" text-anchor="end" class="am-dim">VaR</text>

      <circle cx="651" cy="242" r="3" fill="#34D399"/>
      <text x="668" y="246" class="am-mint">05</text>
      <text x="692" y="246" class="am-ink">Monitoring &amp; attribution</text>
      <text x="936" y="246" text-anchor="end" class="am-dim">report</text>
    </g>

    <!-- faint frontier in the panel corner -->
    <g opacity="0.35">
      <path d="M846 250 C880 214 906 184 936 160" fill="none" stroke="#E0B252" stroke-width="1.2" class="am-curve" pathLength="1"/>
      <circle cx="936" cy="160" r="2.5" fill="#E0B252"/>
    </g>

    <!-- capability strip -->
    <line x1="0" y1="286" x2="1000" y2="286" stroke="#1E293B"/>
    <rect x="0" y="286" width="1000" height="54" fill="url(#amGlow)"/>
    <text x="28" y="318" class="am-mono" font-size="11.5">
      <tspan class="am-mint">ALLOCATION</tspan>
      <tspan class="am-dim">  ·  </tspan>
      <tspan class="am-gold">RISK BUDGETING</tspan>
      <tspan class="am-dim">  ·  </tspan>
      <tspan class="am-cyan">EQUITY RESEARCH</tspan>
      <tspan class="am-dim">  ·  </tspan>
      <tspan class="am-muted">ATTRIBUTION</tspan>
    </text>
    <text x="974" y="318" text-anchor="end" class="am-mono am-gold" font-size="10.5" letter-spacing="0.8">deyirviel.com/asset-management</text>
  </g>
</svg>
