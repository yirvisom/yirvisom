<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Yirviel Somé — Financial Markets Analyst, Casablanca">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0B252"/>
      <stop offset="0.55" stop-color="#E0B252" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#E0B252" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070B14" stop-opacity="0"/>
      <stop offset="0.06" stop-color="#070B14" stop-opacity="1"/>
      <stop offset="0.94" stop-color="#070B14" stop-opacity="1"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip"><rect x="0" y="0" width="1000" height="300" rx="18"/></clipPath>
    <clipPath id="chartClip"><rect x="470" y="70" width="500" height="168"/></clipPath>
    <clipPath id="tapeClip"><rect x="0" y="252" width="1000" height="48"/></clipPath>
  </defs>

  <style>
    .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
    .ink{fill:#E6EDF3}.muted{fill:#94A3B8}.dim{fill:#64748B}
    .mint{fill:#34D399}.gold{fill:#E0B252}.cyan{fill:#38BDF8}.red{fill:#F87171}
    @keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
    .tape{animation:tickerScroll 34s linear infinite}
    @keyframes livePulse{0%,100%{opacity:1}50%{opacity:.15}}
    .live{animation:livePulse 1.7s ease-in-out infinite}
    @keyframes drawLine{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    .trend{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine 2.6s .35s ease-out forwards}
    @media (prefers-reduced-motion: reduce){.tape,.live,.trend{animation:none}.trend{stroke-dashoffset:0}}
  </style>

  <g clip-path="url(#cardClip)">
    <rect width="1000" height="300" fill="url(#panel)"/>
    <rect x="0.75" y="0.75" width="998.5" height="298.5" rx="18" fill="none" stroke="#1E293B" stroke-width="1.5"/>

    <!-- subtle grid -->
    <g opacity="0.35">
      <line x1="0" y1="90" x2="1000" y2="90" stroke="#0F172A"/>
      <line x1="0" y1="140" x2="1000" y2="140" stroke="#0F172A"/>
      <line x1="0" y1="190" x2="1000" y2="190" stroke="#0F172A"/>
    </g>

    <!-- title bar -->
    <circle cx="26" cy="21" r="5.5" fill="#F87171"/>
    <circle cx="46" cy="21" r="5.5" fill="#E0B252"/>
    <circle cx="66" cy="21" r="5.5" fill="#34D399"/>
    <text x="500" y="26" text-anchor="middle" class="mono dim" font-size="13">yirvisom@casablanca — ~/markets</text>
    <text x="974" y="26" text-anchor="end" class="mono dim" font-size="12">UTC+1</text>
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#1E293B"/>

    <!-- identity -->
    <text x="42" y="94" class="mono mint" font-size="13" letter-spacing="3.4">FINANCIAL MARKETS ANALYST</text>
    <text x="40" y="142" class="sans ink" font-size="44" font-weight="800" letter-spacing="-0.5">Yirviel Somé</text>
    <rect x="42" y="158" width="150" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="42" y="188" class="mono muted" font-size="13.5">FMVA® · BIDA® · Casablanca · TZ=Africa/Casablanca</text>

    <!-- tag pills -->
    <g class="mono" font-size="12">
      <rect x="42" y="206" width="86" height="26" rx="13" fill="#0F172A" stroke="#334155"/>
      <text x="85" y="223" text-anchor="middle" class="muted">Equity</text>
      <rect x="136" y="206" width="118" height="26" rx="13" fill="#0F172A" stroke="#334155"/>
      <text x="195" y="223" text-anchor="middle" class="muted">Market Risk</text>
      <rect x="262" y="206" width="112" height="26" rx="13" fill="#0F172A" stroke="#334155"/>
      <text x="318" y="223" text-anchor="middle" class="muted">Data Eng.</text>
    </g>

    <!-- chart -->
    <g clip-path="url(#chartClip)">
      <g opacity="0.55">
        <line x1="470" y1="90" x2="970" y2="90" stroke="#16233A" stroke-width="0.8"/>
        <line x1="470" y1="132" x2="970" y2="132" stroke="#16233A" stroke-width="0.8"/>
        <line x1="470" y1="174" x2="970" y2="174" stroke="#16233A" stroke-width="0.8"/>
        <line x1="470" y1="216" x2="970" y2="216" stroke="#16233A" stroke-width="0.8"/>
      </g>

      <polygon fill="url(#area)"
        points="492,238 492,192 528,177 564,172 600,168 636,160 672,154 708,149 744,144 780,139 816,133 852,127 888,121 924,114 924,238"/>
      <polyline class="trend" pathLength="1" fill="none" stroke="#34D399" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
        points="492,192 528,177 564,172 600,168 636,160 672,154 708,149 744,144 780,139 816,133 852,127 888,121 924,114"/>

      <!-- candles -->
      <g stroke-width="1.4">
        <g stroke="#34D399"><line x1="492" y1="150" x2="492" y2="232"/><rect x="487" y="168" width="10" height="48" fill="#34D399" stroke="none"/></g>
        <g stroke="#34D399"><line x1="528" y1="140" x2="528" y2="220"/><rect x="523" y="158" width="10" height="38" fill="#34D399" stroke="none"/></g>
        <g stroke="#34D399"><line x1="564" y1="148" x2="564" y2="210"/><rect x="559" y="156" width="10" height="32" fill="#34D399" stroke="none"/></g>
        <g stroke="#34D399"><line x1="600" y1="130" x2="600" y2="200"/><rect x="595" y="150" width="10" height="36" fill="#34D399" stroke="none"/></g>
        <g stroke="#F87171"><line x1="636" y1="128" x2="636" y2="198"/><rect x="631" y="138" width="10" height="44" fill="#F87171" stroke="none"/></g>
        <g stroke="#34D399"><line x1="672" y1="120" x2="672" y2="190"/><rect x="667" y="132" width="10" height="44" fill="#34D399" stroke="none"/></g>
        <g stroke="#34D399"><line x1="708" y1="118" x2="708" y2="186"/><rect x="703" y="128" width="10" height="42" fill="#34D399" stroke="none"/></g>
        <g stroke="#F87171"><line x1="744" y1="108" x2="744" y2="180"/><rect x="739" y="122" width="10" height="44" fill="#F87171" stroke="none"/></g>
        <g stroke="#34D399"><line x1="780" y1="100" x2="780" y2="172"/><rect x="775" y="116" width="10" height="42" fill="#34D399" stroke="none"/></g>
        <g stroke="#34D399"><line x1="816" y1="96" x2="816" y2="166"/><rect x="811" y="108" width="10" height="44" fill="#34D399" stroke="none"/></g>
        <g stroke="#34D399"><line x1="852" y1="92" x2="852" y2="160"/><rect x="847" y="104" width="10" height="42" fill="#34D399" stroke="none"/></g>
        <g stroke="#F87171"><line x1="888" y1="84" x2="888" y2="152"/><rect x="883" y="98" width="10" height="42" fill="#F87171" stroke="none"/></g>
        <g stroke="#34D399"><line x1="924" y1="76" x2="924" y2="148"/><rect x="919" y="88" width="10" height="46" fill="#34D399" stroke="none"/></g>
      </g>

      <circle cx="924" cy="111" r="3.6" fill="#34D399"/>
      <line x1="924" y1="76" x2="924" y2="238" stroke="#34D399" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
    </g>

    <text x="470" y="64" class="mono muted" font-size="12">MASI · Bourse de Casablanca</text>
    <text x="947" y="64" text-anchor="end" class="mono mint" font-size="12" font-weight="bold">13,254.10  ▲ +1.28%</text>
    <circle class="live" cx="963" cy="60" r="3.6" fill="#F87171"/>
    <text x="997" y="64" text-anchor="end" class="mono red" font-size="10.5" font-weight="bold">LIVE</text>

    <!-- ticker tape -->
    <line x1="0" y1="252" x2="1000" y2="252" stroke="#1E293B"/>
    <rect x="0" y="252" width="1000" height="48" fill="url(#glow)"/>
    <g clip-path="url(#tapeClip)">
      <g class="tape mono" font-size="13.5">
        <text x="24" y="282">
          <tspan class="mint">MASI</tspan><tspan class="muted"> 13,254.10 </tspan><tspan class="mint">▲1.28%</tspan><tspan class="dim">  ·  </tspan><tspan class="mint">ATW</tspan><tspan class="muted"> 1,346.00 </tspan><tspan class="mint">▲0.6%</tspan><tspan class="dim">  ·  </tspan><tspan class="cyan">IBMC</tspan><tspan class="muted"> 2,045.00 </tspan><tspan class="mint">▲0.4%</tspan><tspan class="dim">  ·  </tspan><tspan class="mint">CMG</tspan><tspan class="muted"> 1,118.00 </tspan><tspan class="mint">▲1.9%</tspan><tspan class="dim">  ·  </tspan><tspan class="red">IAM</tspan><tspan class="muted"> 94.80 </tspan><tspan class="red">▼0.7%</tspan><tspan class="dim">  ·  </tspan><tspan class="mint">BCP</tspan><tspan class="muted"> 268.00 </tspan><tspan class="mint">▲1.1%</tspan><tspan class="dim">  ·  </tspan><tspan class="red">TMA</tspan><tspan class="muted"> 1,505.00 </tspan><tspan class="red">▼0.8%</tspan><tspan class="dim">  ·  </tspan>
        </text>
        <text x="1024" y="282">
          <tspan class="mint">MASI</tspan><tspan class="muted"> 13,254.10 </tspan><tspan class="mint">▲1.28%</tspan><tspan class="dim">  ·  </tspan><tspan class="mint">ATW</tspan><tspan class="muted"> 1,346.00 </tspan><tspan class="mint">▲0.6%</tspan><tspan class="dim">  ·  </tspan><tspan class="cyan">IBMC</tspan><tspan class="muted"> 2,045.00 </tspan><tspan class="mint">▲0.4%</tspan><tspan class="dim">  ·  </tspan><tspan class="mint">CMG</tspan><tspan class="muted"> 1,118.00 </tspan><tspan class="mint">▲1.9%</tspan><tspan class="dim">  ·  </tspan><tspan class="red">IAM</tspan><tspan class="muted"> 94.80 </tspan><tspan class="red">▼0.7%</tspan><tspan class="dim">  ·  </tspan><tspan class="mint">BCP</tspan><tspan class="muted"> 268.00 </tspan><tspan class="mint">▲1.1%</tspan><tspan class="dim">  ·  </tspan><tspan class="red">TMA</tspan><tspan class="muted"> 1,505.00 </tspan><tspan class="red">▼0.8%</tspan><tspan class="dim">  ·  </tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
