<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="6" fill="#febc2e"/>
  <circle cx="78" cy="28" r="6" fill="#28c840"/>
  <text x="450" y="34" text-anchor="middle" fill="#8b949e" font-size="15">yirvisom@fedora: ~/profile</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#21262d" stroke-width="1.5"/>

  <!-- $ whoami -->
  <text x="34" y="88" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="88" fill="#c9d1d9" font-size="16">whoami</text>
  <text x="66" y="114" fill="#d29922" font-size="16">&#8594;</text>
  <text x="98" y="114" fill="#8b949e" font-size="16">Yirviel Som&#233; &middot; Linux systems &amp; financial data</text>

  <!-- $ cat ~/.env -->
  <text x="34" y="142" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="142" fill="#c9d1d9" font-size="16">cat ~/.env</text>
  <text x="66" y="168" fill="#d29922" font-size="16">&#8594;</text>
  <text x="98" y="168" fill="#8b949e" font-size="16">FEDORA=permanent  RHCSA=in_progress  TZ=Africa/Casablanca</text>

  <!-- $ ls work/ -->
  <text x="34" y="196" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="196" fill="#c9d1d9" font-size="16">ls work/</text>
  <text x="66" y="222" fill="#d29922" font-size="16">&#8594;</text>
  <text x="98" y="222" fill="#8b949e" font-size="16">M-A-Clean-Room/&nbsp;&nbsp;casablanca-quant-framework/&nbsp;&nbsp;deyirviel.com/</text>

  <!-- $ echo -->
  <text x="34" y="250" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="250" fill="#c9d1d9" font-size="16">echo $open_to</text>
  <text x="66" y="276" fill="#d29922" font-size="16">&#8594;</text>
  <text x="98" y="276" fill="#58a6ff" font-size="16">analysis &amp; systems &mdash; open for work</text>

  <rect x="34" y="293" width="10" height="20" rx="2" fill="#3fb950" opacity="0.9"/>
</svg>