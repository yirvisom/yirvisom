<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" font-family="Menlo, Consolas, 'Liberation Mono', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="900" height="320" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="54" cy="28" r="6" fill="#febc2e"/>
  <circle cx="78" cy="28" r="6" fill="#28c840"/>
  <text x="450" y="34" text-anchor="middle" fill="#8b949e" font-size="15">yirvisom@fedora: ~/profile</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#21262d" stroke-width="1.5"/>

  <!-- $ whoami -->
  <text x="34" y="92" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="92" fill="#c9d1d9" font-size="16">whoami</text>
  <text x="66" y="120" fill="#d29922" font-size="16">→</text>
  <text x="100" y="120" fill="#8b949e" font-size="16">Yirviel Somé · Linux systems &amp; financial data</text>

  <!-- $ cat ~/.env -->
  <text x="34" y="150" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="150" fill="#c9d1d9" font-size="16">cat ~/.env</text>
  <text x="66" y="178" fill="#d29922" font-size="16">→</text>
  <text x="100" y="178" fill="#8b949e" font-size="16">FEDORA=permanent  RHCSA=in_progress  TZ=Africa/Casablanca</text>

  <!-- $ ls work/ -->
  <text x="34" y="208" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="208" fill="#c9d1d9" font-size="16">ls work/</text>
  <text x="66" y="236" fill="#d29922" font-size="16">→</text>
  <text x="100" y="236" fill="#58a6ff" font-size="16">M-A-Clean-Room/   casablanca-quant-framework/   deyirviel.com/</text>

  <!-- $ echo $open_to -->
  <text x="34" y="266" fill="#3fb950" font-size="16" font-weight="bold">$</text>
  <text x="66" y="266" fill="#c9d1d9" font-size="16">echo $open_to</text>
  <text x="66" y="294" fill="#d29922" font-size="16">→</text>
  <text x="100" y="294" fill="#8b949e" font-size="16">analysis &amp; systems — open for work</text>
</svg>