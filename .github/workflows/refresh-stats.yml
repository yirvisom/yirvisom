name: Refresh profile assets

on:
  schedule:
    - cron: "17 4 * * *"   # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Refresh assets/stats.svg (GitHub API)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats.py

      - name: Refresh assets/banner.svg (live MASI, TradingView CSEMA)
        run: python3 scripts/render_banner.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "✓ assets unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/banner.svg
          git commit -m "chore: refresh profile assets"
          git push
